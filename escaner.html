<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escáner Asistencia GENCANA</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 30px; background: #f9f9f9; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
        .alternativa { margin-top: 20px; padding: 15px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 20px auto; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        #lista-inscritos-container { max-width: 500px; margin: 30px auto; text-align: left; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; }
        #lista-inscritos li { padding: 12px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; display: flex; justify-content: space-between; }
        .pendiente { background: #fff3cd; color: #856404; border-color: #ffeeba !important; }
        .confirmado { background: #d4edda; color: #155724; border-color: #c3e6cb !important; }
    </style>
</head>
<body>
    <h2>Control Logístico GENCANA</h2>
    
    <div style="margin-bottom: 20px;">
        <label><strong>Seleccione el Evento Actual:</strong></label><br>
        <select id="select-evento-escaner" style="padding: 10px; margin-top: 5px; width: 80%; max-width: 300px;" onchange="cargarInscritos()">
            <option value="">Cargando eventos...</option>
        </select>
    </div>

    <div id="reader"></div>

    <div class="alternativa">
        <p>¿Sin código QR? Ingresa la cédula o código:</p>
        <input type="text" id="cedulaInput" placeholder="Ej: gnc300">
        <button onclick="registrarManual()">Registrar</button>
    </div>
    
    <h3 id="resultado"></h3>

    <!-- Contenedor dinámico de la lista de inscritos -->
    <div id="lista-inscritos-container">
        <h3 style="margin-top: 0;">Lista de Inscritos</h3>
        <ul id="lista-inscritos" style="list-style: none; padding: 0;"></ul>
    </div>

    <script>
        const API_URL = "https://gencana-sistema-production.up.railway.app";

        async function cargarEventosEscaner() {
            try {
                const res = await fetch(`${API_URL}/eventos/`);
                if (!res.ok) throw new Error("Error al obtener eventos");
                
                const eventos = await res.json();
                const select = document.getElementById('select-evento-escaner');
                if (!select) return;
                
                select.innerHTML = '<option value="">Seleccione un Evento...</option>';
                eventos.forEach(ev => {
                    const option = document.createElement('option');
                    option.value = ev.ID_Evento;
                    option.textContent = ev.Nombre_Evento;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error("Error cargando los eventos:", error);
                document.getElementById("resultado").innerText = "❌ Error cargando los eventos.";
            }
        }
        window.onload = cargarEventosEscaner;

        // Función para cargar los inscritos del evento seleccionado
        async function cargarInscritos() {
            const idEvento = document.getElementById('select-evento-escaner').value;
            const container = document.getElementById('lista-inscritos-container');
            const lista = document.getElementById('lista-inscritos');

            if (!idEvento) {
                container.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/eventos/${idEvento}/inscritos/`);
                if (!res.ok) throw new Error("Error al obtener inscritos");

                const inscritos = await res.json();
                container.style.display = 'block';
                lista.innerHTML = "";

                if (inscritos.length === 0) {
                    lista.innerHTML = "<li style='background:#f4f4f4; text-align:center;'>No hay inscritos en este evento.</li>";
                    return;
                }

                inscritos.forEach(p => {
                    const li = document.createElement('li');
                    li.id = `participante-${p.ID_Participante}`;
                    
                    const asisitido = p.Asistencia === 1 || p.Asistencia === true || p.estado === 'Confirmado';
                    li.className = asisitido ? 'confirmado' : 'pendiente';
                    
                    const icono = asisitido ? '✅' : '⏳';
                    li.innerHTML = `<span>${p.Nombres || p.nombre} (${p.Cedula || p.cedula})</span> <span>${icono}</span>`;
                    lista.appendChild(li);
                });
            } catch (error) {
                console.error("Error al cargar inscritos:", error);
                lista.innerHTML = "<li style='color:red;'>Error al cargar la lista de participantes.</li>";
            }
        }

        async function enviarAsistencia(payload) {
            try {
                const response = await fetch(`${API_URL}/asistencia/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                const resultadoUI = document.getElementById("resultado");
                
                if (response.ok) {
                    resultadoUI.innerHTML = `<span style="color: green;">✅ ${data.mensaje}</span>`;
                    
                    // Pintar de verde automáticamente en la lista de abajo
                    const fila = document.getElementById(`participante-${data.id_participante}`);
                    if (fila) {
                        fila.className = 'confirmado';
                        fila.innerHTML = fila.innerHTML.replace('⏳', '✅');
                    }
                } else {
                    // Mostrar los mensajes de error exactos del backend (ya confirmó, no inscrito, etc.)
                    resultadoUI.innerHTML = `<span style="color: red;">${data.detail}</span>`;
                }
            } catch (error) {
                document.getElementById("resultado").innerText = "❌ Error de conexión al servidor.";
            }
        }

        function onScanSuccess(decodedText) {
            const idEvento = document.getElementById('select-evento-escaner').value;
            if (!idEvento) return alert("¡Seleccione un evento primero!");
            
            document.getElementById("resultado").innerText = "⏳ Verificando QR...";
            enviarAsistencia({ evento_id: parseInt(idEvento), qr_data: decodedText });
        }

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
        html5QrcodeScanner.render(onScanSuccess);

        function registrarManual() {
            const idEvento = document.getElementById('select-evento-escaner').value;
            if (!idEvento) return alert("¡Seleccione un evento primero!");
            
            const cedula = document.getElementById("cedulaInput").value;
            if(!cedula) return alert("Ingresa un número válido");
            
            document.getElementById("resultado").innerText = "⏳ Verificando código...";
            enviarAsistencia({ evento_id: parseInt(idEvento), numero_identificacion: cedula });
        }
    </script>
</body>
</html>
